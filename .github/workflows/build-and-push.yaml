name: Build and Push

on:
  workflow_dispatch:
    inputs:
      build_linux:
        description: 'Build Linux'
        required: false
        default: true
        type: boolean
      build_windows:
        description: 'Build Windows'
        required: false
        default: true
        type: boolean
      build_macos_arm64:
        description: 'Build macOS ARM64'
        required: false
        default: true
        type: boolean
      build_macos_x64:
        description: 'Build macOS x64'
        required: false
        default: true
        type: boolean

env:
  AWS_CLI_VERSION: "2.22.35"

jobs:
  build-linux:
    if: inputs.build_linux
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
      
      - name: Setup AWS CLI
        run: |
          sudo rm -rf /usr/local/aws-cli /usr/local/bin/aws /usr/local/bin/aws_completer /usr/local/bin/aws-cli /usr/local/bin/aws-cli-plugin
          sudo apt-get remove -y awscli
          curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64-${{ env.AWS_CLI_VERSION }}.zip" -o "awscliv2.zip"
          unzip -q awscliv2.zip
          sudo ./aws/install
          aws --version
      
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
      
      - name: Generate build info
        run: |
          echo "BUILD_NUMBER=${{ github.run_number }}" >> $GITHUB_ENV
          echo "COMMIT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
          echo "BUILD_TIMESTAMP=$(date -u +%Y%m%d_%H%M%S)" >> $GITHUB_ENV
      
      - name: Build standard zip
        run: ./gradlew createZip -PbuildNumber=$BUILD_NUMBER -PcommitSha=$COMMIT_SHA -PbuildTimestamp=$BUILD_TIMESTAMP
      
      - name: Copy standard build artifacts
        run: cp build/dist/Simbrain*.zip $GITHUB_WORKSPACE
      
      - name: Clean for full build
        run: ./gradlew clean
      
      - name: Build full zip
        run: ./gradlew createZip -PversionSuffix="_full" -PincludeAllPlatforms=true -PbuildNumber=$BUILD_NUMBER -PcommitSha=$COMMIT_SHA -PbuildTimestamp=$BUILD_TIMESTAMP
      
      - name: Copy full build artifacts
        run: cp build/dist/Simbrain4Beta_full.zip "$GITHUB_WORKSPACE"
      
      - name: Configure AWS CLI
        env:
          R2_ACCESS_KEY: ${{ secrets.R2_ACCESS_KEY }}
          R2_SECRET_KEY: ${{ secrets.R2_SECRET_KEY }}
        run: |
          aws configure set aws_access_key_id $R2_ACCESS_KEY
          aws configure set aws_secret_access_key $R2_SECRET_KEY
          aws configure set default.region auto
      
      - name: Upload to Cloudflare R2
        env:
          CLOUDFLARE_R2_BUCKET: ${{ secrets.CLOUDFLARE_R2_BUCKET }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          aws s3 cp "$GITHUB_WORKSPACE/Simbrain4Beta.zip" "s3://$CLOUDFLARE_R2_BUCKET/" --endpoint-url=https://$CLOUDFLARE_ACCOUNT_ID.r2.cloudflarestorage.com
          aws s3 cp "$GITHUB_WORKSPACE/Simbrain4Beta_full.zip" "s3://$CLOUDFLARE_R2_BUCKET/" --endpoint-url=https://$CLOUDFLARE_ACCOUNT_ID.r2.cloudflarestorage.com

  build-windows:
    if: inputs.build_windows
    runs-on: windows-latest
    environment: windows
    
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
      
      - name: Setup AWS CLI
        run: |
          choco uninstall awscli -y || echo "No existing AWS CLI via Chocolatey"
          choco install awscli --version=${{ env.AWS_CLI_VERSION }}
          aws --version
      
      - name: Install Windows SDK
        run: choco install windows-sdk-10.1
      
      - name: Install Certificate
        run: |
          $base64EncodedCert = "${{ secrets.CERTIFICATE_ENCODED }}"
          $certBytes = [System.Convert]::FromBase64String($base64EncodedCert)
          [System.IO.File]::WriteAllBytes("simbrain.p12", $certBytes)
          $pfxPassword = ConvertTo-SecureString -String "${{ secrets.CERTIFICATE_PASSWORD }}" -AsPlainText -Force
          Import-PfxCertificate -FilePath "simbrain.p12" -CertStoreLocation Cert:\CurrentUser\My -Password $pfxPassword
      
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
      
      - name: Generate build info
        shell: pwsh
        run: |
          echo "BUILD_NUMBER=${{ github.run_number }}" >> $env:GITHUB_ENV
          echo "COMMIT_SHA=$(git rev-parse --short HEAD)" >> $env:GITHUB_ENV
          $timestamp = (Get-Date).ToUniversalTime().ToString("yyyyMMdd_HHmmss")
          echo "BUILD_TIMESTAMP=$timestamp" >> $env:GITHUB_ENV
      
      - name: Build Windows executable
        run: ./gradlew renameWindowsExecutable -PbuildNumber=${{ env.BUILD_NUMBER }} -PcommitSha=${{ env.COMMIT_SHA }} -PbuildTimestamp=${{ env.BUILD_TIMESTAMP }}
      
      - name: Configure AWS CLI
        run: |
          & "C:\Program Files\Amazon\AWSCLIV2\aws" configure set aws_access_key_id ${{ secrets.R2_ACCESS_KEY }}
          & "C:\Program Files\Amazon\AWSCLIV2\aws" configure set aws_secret_access_key ${{ secrets.R2_SECRET_KEY }}
          & "C:\Program Files\Amazon\AWSCLIV2\aws" configure set default.region auto
      
      - name: Upload to Cloudflare R2
        shell: pwsh
        run: |
          $path = '.\build\dist'
          $files = Get-ChildItem -Path $path -Filter 'Simbrain*.exe'
          if ($files.Count -eq 1) {
            & "C:\Program Files\Amazon\AWSCLIV2\aws" s3 cp $files[0].FullName s3://${{ secrets.CLOUDFLARE_R2_BUCKET }}/ --endpoint-url=https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
          } elseif ($files.Count -eq 0) {
            Write-Error "No files found matching the pattern 'Simbrain*.exe' in $path"
          } else {
            Write-Error "Multiple files found matching the pattern 'Simbrain*.exe' in $path. Only one file is expected."
          }

  build-macos-arm64:
    if: inputs.build_macos_arm64
    runs-on: macos-latest
    environment: macos
    
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
      
      - name: Setup AWS CLI
        run: |
          curl "https://awscli.amazonaws.com/AWSCLIV2-${{ env.AWS_CLI_VERSION }}.pkg" -o "awscliv2.pkg"
          sudo installer -pkg awscliv2.pkg -target /
      
      - name: Install Dependencies
        run: |
          brew update
          brew install jq
      
      - name: Setup Apple Certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.MAC_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          echo $CERTIFICATE_BASE64 | base64 --decode > certificate.p12
          security create-keychain -p "${KEYCHAIN_PASSWORD}" build.keychain
          KEYCHAIN_FULL_PATH="$HOME/Library/Keychains/build.keychain-db"
          security set-keychain-settings -u "${KEYCHAIN_FULL_PATH}"
          security default-keychain -d user -s "${KEYCHAIN_FULL_PATH}"
          security unlock-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_FULL_PATH}"
          security import certificate.p12 -k "${KEYCHAIN_FULL_PATH}" -P "${CERTIFICATE_PASSWORD}" -T /usr/bin/codesign
          security set-key-partition-list -S "apple-tool:,apple:,codesign:" -s -k "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_FULL_PATH}"
          security list-keychains -s "${KEYCHAIN_FULL_PATH}"
          rm -f certificate.p12
      
      - name: Setup Apple ID
        run: |
          echo "APPLE_ID=${{ secrets.APPLE_ID }}" >> $GITHUB_ENV
          echo "APP_SPECIFIC_PASSWORD=${{ secrets.APP_SPECIFIC_PASSWORD }}" >> $GITHUB_ENV
          echo "TEAM_ID=${{ secrets.TEAM_ID }}" >> $GITHUB_ENV
      
      - name: Authenticate with Apple Notary Service
        run: |
          xcrun notarytool store-credentials "AC_PASSWORD" --apple-id "$APPLE_ID" --team-id "$TEAM_ID" --password "$APP_SPECIFIC_PASSWORD"
      
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'
          architecture: 'aarch64'
      
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
      
      - name: Generate build info
        run: |
          echo "BUILD_NUMBER=${{ github.run_number }}" >> $GITHUB_ENV
          echo "COMMIT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
          echo "BUILD_TIMESTAMP=$(date -u +%Y%m%d_%H%M%S)" >> $GITHUB_ENV
      
      - name: Build and Sign
        env:
          DEVELOPER_ID: ${{ secrets.DEVELOPER_ID }}
        run: |
          ./gradlew shadowJar -PbuildNumber=$BUILD_NUMBER -PcommitSha=$COMMIT_SHA -PbuildTimestamp=$BUILD_TIMESTAMP
          ./etc/sign_mac_jar.sh
          mkdir -p build/main
          cp build/libs/Simbrain.jar build/main/Simbrain.jar
          cp -r simulations build/main/simulations
          cp -r scripts build/main/scripts
          cp etc/License.txt build/main/License.txt
          ./gradlew jpackageMacOS -PbuildNumber=$BUILD_NUMBER -PcommitSha=$COMMIT_SHA -PbuildTimestamp=$BUILD_TIMESTAMP
          ./gradlew notarizeMacApp -PbuildNumber=$BUILD_NUMBER -PcommitSha=$COMMIT_SHA -PbuildTimestamp=$BUILD_TIMESTAMP
      
      - name: Configure AWS CLI
        env:
          R2_ACCESS_KEY: ${{ secrets.R2_ACCESS_KEY }}
          R2_SECRET_KEY: ${{ secrets.R2_SECRET_KEY }}
        run: |
          aws configure set aws_access_key_id $R2_ACCESS_KEY
          aws configure set aws_secret_access_key $R2_SECRET_KEY
          aws configure set default.region auto
      
      - name: Upload to Cloudflare R2
        env:
          CLOUDFLARE_R2_BUCKET: ${{ secrets.CLOUDFLARE_R2_BUCKET }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          aws s3 cp build/dist/Simbrain*.dmg s3://$CLOUDFLARE_R2_BUCKET/ --endpoint-url=https://$CLOUDFLARE_ACCOUNT_ID.r2.cloudflarestorage.com

  build-macos-x64:
    if: inputs.build_macos_x64
    runs-on: macos-latest
    environment: macos
    
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
      
      - name: Setup AWS CLI
        run: |
          curl "https://awscli.amazonaws.com/AWSCLIV2-${{ env.AWS_CLI_VERSION }}.pkg" -o "awscliv2.pkg"
          sudo installer -pkg awscliv2.pkg -target /
      
      - name: Install Dependencies
        run: |
          brew update
          brew install jq
      
      - name: Setup Apple Certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.MAC_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          echo $CERTIFICATE_BASE64 | base64 --decode > certificate.p12
          security create-keychain -p "${KEYCHAIN_PASSWORD}" build.keychain
          KEYCHAIN_FULL_PATH="$HOME/Library/Keychains/build.keychain-db"
          security set-keychain-settings -u "${KEYCHAIN_FULL_PATH}"
          security default-keychain -d user -s "${KEYCHAIN_FULL_PATH}"
          security unlock-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_FULL_PATH}"
          security import certificate.p12 -k "${KEYCHAIN_FULL_PATH}" -P "${CERTIFICATE_PASSWORD}" -T /usr/bin/codesign
          security set-key-partition-list -S "apple-tool:,apple:,codesign:" -s -k "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_FULL_PATH}"
          security list-keychains -s "${KEYCHAIN_FULL_PATH}"
          rm -f certificate.p12
      
      - name: Setup Apple ID
        run: |
          echo "APPLE_ID=${{ secrets.APPLE_ID }}" >> $GITHUB_ENV
          echo "APP_SPECIFIC_PASSWORD=${{ secrets.APP_SPECIFIC_PASSWORD }}" >> $GITHUB_ENV
          echo "TEAM_ID=${{ secrets.TEAM_ID }}" >> $GITHUB_ENV
      
      - name: Authenticate with Apple Notary Service
        run: |
          xcrun notarytool store-credentials "AC_PASSWORD" --apple-id "$APPLE_ID" --team-id "$TEAM_ID" --password "$APP_SPECIFIC_PASSWORD"
      
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'
          architecture: 'x64'
      
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
      
      - name: Generate build info
        run: |
          echo "BUILD_NUMBER=${{ github.run_number }}" >> $GITHUB_ENV
          echo "COMMIT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
          echo "BUILD_TIMESTAMP=$(date -u +%Y%m%d_%H%M%S)" >> $GITHUB_ENV
      
      - name: Build and Sign
        env:
          DEVELOPER_ID: ${{ secrets.DEVELOPER_ID }}
        run: |
          ./gradlew shadowJar -PbuildNumber=$BUILD_NUMBER -PcommitSha=$COMMIT_SHA -PbuildTimestamp=$BUILD_TIMESTAMP
          ./etc/sign_mac_jar.sh
          mkdir -p build/main
          cp build/libs/Simbrain.jar build/main/Simbrain.jar
          cp -r simulations build/main/simulations
          cp -r scripts build/main/scripts
          cp etc/License.txt build/main/License.txt
          ./gradlew jpackageMacOS -PbuildNumber=$BUILD_NUMBER -PcommitSha=$COMMIT_SHA -PbuildTimestamp=$BUILD_TIMESTAMP
          ./gradlew notarizeMacApp -PversionSuffix="_x64" -PbuildNumber=$BUILD_NUMBER -PcommitSha=$COMMIT_SHA -PbuildTimestamp=$BUILD_TIMESTAMP
      
      - name: Configure AWS CLI
