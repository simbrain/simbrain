name: build_windows

on:
  push:
    branches:
      - Simbrain4

jobs:
  build:
    if: contains(github.event.head_commit.message, '[push windows]')
    runs-on: windows-latest
    environment: windows
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v1
        with:
          java-version: '17'
      - name: Install Windows SDK
        run: choco install windows-sdk-10.1
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
      - name: Build with Gradle
        shell: powershell
        run: |
          # 1. Decode the base64-encoded PFX/P12
          $base64EncodedCert = "${{ secrets.CERTIFICATE_ENCODED }}"
          $certBytes = [System.Convert]::FromBase64String($base64EncodedCert)
          [System.IO.File]::WriteAllBytes("simbrain.p12", $certBytes)
      
          # 2. Load the certificate in-memory
          $pfxPassword = ConvertTo-SecureString -String "${{ secrets.CERTIFICATE_PASSWORD }}" -AsPlainText -Force
          $cert = New-Object System.Security.Cryptography.X509Certificates.X509Certificate2("simbrain.p12", $pfxPassword)
      
          # 3. Verify that the certificate actually contains the Code Signing EKU
          $ekuOid = "1.3.6.1.5.5.7.3.3"  # OID for "Code Signing"
          $ekuExtension = $cert.Extensions | Where-Object { $_.Oid.FriendlyName -eq "Enhanced Key Usage" }
      
          if (-not $ekuExtension) {
            Write-Error "Certificate has no Enhanced Key Usage extension."
            exit 1
          }
      
          $hasCodeSign = $ekuExtension.EnhancedKeyUsages | Where-Object { $_.Value -eq $ekuOid }
          if (-not $hasCodeSign) {
            Write-Error "This certificate does not have the Code Signing EKU."
            exit 1
          }
          Write-Host "Certificate is valid for code signing."
      
          # 4. Find Signtool.exe in Windows Kits folder (64-bit)
          $windowsKitsPath = 'C:\Program Files (x86)\Windows Kits\10\bin'
          $signtool = Get-ChildItem -Path $windowsKitsPath -Recurse -Filter 'signtool.exe' |
            Where-Object { $_.FullName -match '\\x64\\' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1
      
          if (!$signtool) {
            Write-Error "Could not find signtool.exe in any x64 subfolder under $windowsKitsPath."
            exit 1
          }
      
          # Add containing folder to PATH
          $folder = Split-Path $signtool.FullName
          $env:PATH += ";$folder"
          Write-Host "PATH has been updated to: $env:PATH"
      
          # Create a dummy file to test-sign
          "dummy" | Out-File "testfile.exe"
      
          # 5. Sign using the .p12 file directly
          Write-Host "Signing with file-based approach..."
          signtool.exe sign `
            /v `
            /fd SHA256 `
            /f simbrain.p12 `
            /p "${{ secrets.CERTIFICATE_PASSWORD }}" `
            testfile.exe
          
          Write-Host "Now running Gradle build..."
          ./gradlew signWindowsApp
      - name: Install AWS CLI
        run: |
          choco install awscli -y

      - name: Configure AWS CLI for Cloudflare R2
        run: |
          aws configure set aws_access_key_id ${{ secrets.R2_ACCESS_KEY }}
          aws configure set aws_secret_access_key ${{ secrets.R2_SECRET_KEY }}
          aws configure set default.region auto

      - name: Upload to Cloudflare R2
        shell: pwsh
        run: |
          $path = '.\build\dist'
          $files = Get-ChildItem -Path $path -Filter 'Simbrain*.exe'
          if ($files.Count -eq 1) {
            aws s3 cp $files[0].FullName s3://${{ secrets.CLOUDFLARE_R2_BUCKET }}/ --endpoint-url=https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com --checksum-algorithm SHA256
          } elseif ($files.Count -eq 0) {
            Write-Error "No files found matching the pattern 'Simbrain*.exe' in $path"
          } else {
            Write-Error "Multiple files found matching the pattern 'Simbrain*.exe' in $path. Only one file is expected."
          }
