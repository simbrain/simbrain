# Simbrain global FlatLaf 3.5.4 custom defaults.
#
# Registered via FlatLaf.registerCustomDefaultsSource("org.simbrain.util.theme")
# in org.simbrain.util.Theme.installSimbrainFlatLafDefaults(). This file is
# loaded for EVERY theme (light and dark) and merged AFTER FlatLaf's bundled
# properties, so these keys override the stock values.

# Single brand accent, derived from the Simbrain logo hue (~190 deg) toned to a
# usable saturation/lightness for UI accents. @accentColor is a properties-file
# VARIABLE (not a UIManager key) and drives the whole accent cascade: focus ring,
# focused border, selection background, default-button border, checkmarks, links,
# slider, and tab underline.
@accentColor = #2A9AB2

# Rounded corners (integer px arc diameter). Stock: Component.arc=5, Button.arc=6,
# CheckBox.arc=4, ProgressBar.arc=4, TextComponent.arc=0 (square).
Component.arc = 8
Button.arc = 8
CheckBox.arc = 5
ProgressBar.arc = 8
TextComponent.arc = 8

# Focus ring. The base FlatLaf default is Component.focusWidth=0 (no outer ring),
# so set it explicitly. Keep it small: the outer ring grows component size.
# innerFocusWidth draws inside the component and does not change its size.
Component.focusWidth = 1
Component.innerFocusWidth = 1

# Chevron arrows (already the 3.5.4 default; set explicitly to document intent).
Component.arrowType = chevron
